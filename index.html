<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a6b">
<title>Lê Thị Thanh Thuỳ – Asahi Life</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:#0b2a6b;color:#ff7fb8;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;padding:24px 16px;
}
.card{
  width:100%;max-width:400px;text-align:center;
  background:linear-gradient(160deg,#2f6fe4 0%,#1b4fc0 50%,#113a94 100%);
  border-radius:28px;padding:44px 28px 36px;
  box-shadow:0 24px 60px rgba(0,0,0,.35);
  position:relative;overflow:hidden;
}
.card::before{
  content:"";position:absolute;top:-120px;right:-120px;width:280px;height:280px;
  border-radius:50%;background:rgba(255,255,255,.08);
}
.card::after{
  content:"";position:absolute;bottom:-90px;left:-90px;width:200px;height:200px;
  border-radius:50%;background:rgba(255,255,255,.06);
}
.avatar{
  position:relative;z-index:1;
  width:168px;height:168px;margin:0 auto 24px;border-radius:50%;
  padding:5px;background:#ff7fb8;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
h1{position:relative;z-index:1;font-size:26px;font-weight:700;letter-spacing:.2px;line-height:1.25}
.title{position:relative;z-index:1;margin-top:8px;font-size:16px;font-weight:500;opacity:.95}
.company{
  position:relative;z-index:1;display:inline-block;margin-top:12px;
  font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;
  padding:6px 14px;border:1px solid rgba(255,127,184,.85);border-radius:999px;
}
.divider{position:relative;z-index:1;width:48px;height:2px;background:rgba(255,127,184,.85);margin:26px auto}
.info{position:relative;z-index:1;list-style:none;display:grid;gap:10px;text-align:left}
.info a{
  display:flex;align-items:center;gap:14px;color:#ff7fb8;text-decoration:none;
  padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.12);
  font-size:15px;word-break:break-all;transition:background .2s;
}
.info a:hover,.info a:active{background:rgba(255,255,255,.2)}
.info svg{flex:0 0 20px;width:20px;height:20px;fill:none;stroke:#ff7fb8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.save{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;margin-top:26px;padding:16px 20px;border:0;border-radius:16px;
  background:#ff7fb8;color:#113a94;font-size:17px;font-weight:700;font-family:inherit;
  cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.2);transition:transform .15s,box-shadow .15s;
}
.save:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.25)}
.save:active{transform:translateY(0)}
.save svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:360px){
  .card{padding:36px 20px 28px}
  .avatar{width:140px;height:140px}
  h1{font-size:23px}
}
</style>
</head>
